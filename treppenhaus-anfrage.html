<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Treppenhausreinigung anfragen · LISS</title><link rel="stylesheet" href="assets/site.css"><style>main{max-width:960px;margin:auto;padding:40px 20px}section{background:#fff;border:1px solid #c9d5e8;padding:22px;margin:14px 0}h1,h2{color:#123f91}h1{border-bottom:2px solid #123f91;padding-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.wide{grid-column:1/-1}label{display:grid;gap:5px;font-weight:700;color:#34445e}input,select,textarea{font:inherit;padding:9px;border:1px solid #b9c9dc;border-radius:4px}textarea{min-height:90px}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.checks label{display:flex;gap:7px;border:1px solid #d5deec;padding:9px;font-weight:400}.btn{padding:11px 16px;margin:4px;border:0;border-radius:4px;background:#123f91;color:#fff;font-weight:700}.status{color:#1d5b2e;font-weight:700}@media(max-width:700px){.grid,.checks{grid-template-columns:1fr}}</style></head><body><main><p>LISS REINIGUNGSSERVICE</p><h1>Treppenhausreinigung · Anfrage</h1><p>Bitte ausfüllen. Die Anfrage ist noch kein verbindliches Angebot.</p><form id="f"><section><h2>Kontakt und Objekt</h2><div class="grid"><label>Hausverwaltung / Firma *<input id="company" required></label><label>Ansprechperson<input id="contact"></label><label>E-Mail *<input id="email" type="email" required></label><label class="wide">Adresse des Objekts<input id="address"></label><label>Häuser<input id="houses" type="number"></label><label>Eingänge<input id="entrances" type="number"></label><label>Etagen je Eingang<input id="floors"></label><label>Wohnungen gesamt<input id="apartments" type="number"></label><label>Aufzüge<input id="elevators" type="number"></label></div></section><section><h2>Flächen und Leistungen</h2><div class="grid"><label>Fläche m²<input id="area" type="number"></label><label>Bodenbelag<select id="floor"><option>Bitte wählen</option><option>Fliesen</option><option>Naturstein</option><option>PVC / Linoleum</option><option>Gemischt</option></select></label><label>Fenster / Glas<select id="windows"><option>Keine regelmäßige Glasreinigung</option><option>Nur Eingangstüren</option><option>Treppenhausfenster</option><option>Fenster und Türen</option></select></label></div><p>Gewünschte Leistungen</p><div class="checks"><label><input type="checkbox" name="s" value="Treppen und Podeste reinigen" checked>Treppen und Podeste</label><label><input type="checkbox" name="s" value="Feuchtwischen" checked>Feuchtwischen</label><label><input type="checkbox" name="s" value="Handläufe und Geländer" checked>Handläufe / Geländer</label><label><input type="checkbox" name="s" value="Eingang und Haustür" checked>Eingang / Haustür</label><label><input type="checkbox" name="s" value="Aufzug">Aufzug</label><label><input type="checkbox" name="s" value="Keller und Müllbereich">Keller / Müllbereich</label></div></section><section><h2>Turnus und Hinweise</h2><div class="grid"><label>Turnus<select id="frequency"><option>1× pro Woche</option><option>2× pro Woche</option><option>3× pro Woche</option><option>5× pro Woche</option></select></label><label>Zugang<input id="access"></label><label>Material / Wasser vor Ort<input id="storage"></label><label class="wide">Weitere Angaben<textarea id="notes"></textarea></label></div></section><section><button class="btn" type="submit">Anfrage per E-Mail vorbereiten</button><button class="btn" type="button" id="save">Zwischenspeichern</button><p id="status" class="status"></p><small>Beim Absenden öffnet sich dein E-Mail-Programm. Bitte prüfen und selbst senden.</small></section></form></main><script>(()=>{const ids=['company','contact','email','address','houses','entrances','floors','apartments','elevators','area','floor','windows','frequency','access','storage','notes'],q=id=>document.getElementById(id),v=id=>(q(id).value||'').trim(),save=()=>{localStorage.setItem('liss-treppenhaus-anfrage-v1',JSON.stringify(Object.fromEntries(ids.map(id=>[id,v(id)]))));q('status').textContent='Auf diesem Gerät gespeichert.'},body=()=>ids.map(id=>id+': '+v(id)).concat(['Leistungen:',...[...document.querySelectorAll('input[name=s]:checked')].map(x=>'- '+x.value)]).join('\n');document.getElementById('f').onsubmit=e=>{e.preventDefault();save();location.href='mailto:info@liss-reinigungsservice.de?subject='+encodeURIComponent('Treppenhausreinigung · Anfrage')+'&body='+encodeURIComponent(body())};q('save').onclick=save;})();</script></body></html>
